<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'; frame-src 'none'">
<link rel="stylesheet" href="xterm.css"><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101216}#terminal{--top-inset:8px;box-sizing:content-box;width:calc(100% - 8px);height:calc(100% - var(--top-inset) - 80px);padding:var(--top-inset) 0 80px 8px;background:#101216}#terminal .xterm-scrollable-element>.scrollbar{opacity:0;pointer-events:none;transition:opacity 160ms linear}#terminal.scrolling .xterm-scrollable-element>.scrollbar{opacity:1;pointer-events:auto}</style></head>
<body><div id="terminal"></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script src="terminal.js"></script></body></html>
